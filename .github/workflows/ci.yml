name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - name: No focused or skipped tests
        run: |
          if grep -rnE "\.(only|skip)\(|it\.todo\(|xit\(" tests/; then
            echo "Focused or skipped tests found" && exit 1
          fi
      - name: Hook scripts parse
        run: for f in .claude/hooks/*.sh scripts/*.sh; do bash -n "$f"; done
